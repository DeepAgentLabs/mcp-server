# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Keys, sessions and signup limits live in Supabase PostgreSQL; apply
# deploy/supabase/schema.sql there first (see docs/remote-hosting.md).
services:
  - type: web
    name: deep-agentic-core-mcp
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./deploy/docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      # Supabase pooler URI for the mcp_service role, ending in ?sslmode=require
      - key: DEEP_AGENTIC_CORE_MCP_DATABASE_URL
        sync: false
      # https://<custom domain or assigned onrender.com hostname>; enables signup
      - key: DEEP_AGENTIC_CORE_MCP_PUBLIC_URL
        sync: false
      - key: DEEP_AGENTIC_CORE_MCP_HTTP_HOST
        value: 0.0.0.0

name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra http --python 3.12

      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import ast
          import json
          import os
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          tree = ast.parse(Path("src/deep_agentic_core_mcp/__init__.py").read_text())
          runtime = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == "__version__"
                                 for target in node.targets))
          server = json.loads(Path("server.json").read_text())
          assert project["version"] == runtime == server["version"] == version
          assert all(package["version"] == version for package in server["packages"])
          assert f"## {version} - " in Path("CHANGELOG.md").read_text()
          print("Release versions and changelog match:", version)
          PY

      - name: Build distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-github-release:
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          start = None
          end = None
          heading = f"## {version} - "
          for index, line in enumerate(changelog):
              if line.startswith(heading):
                  start = index
                  continue
              if start is not None and line.startswith("## "):
                  end = index
                  break

          if start is None:
              raise SystemExit(
                  f"Could not find CHANGELOG.md section for version {version}."
              )

          if end is None:
              end = len(changelog)

          section = "\n".join(changelog[start:end]).strip() + "\n"
          Path("release-notes.md").write_text(section, encoding="utf-8")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: create-github-release
    permissions:
      id-token: write # required for GitHub OIDC authentication with MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  deploy:
    name: Deploy AWS
    needs: publish-pypi
    environment: aws
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: aws-mcp-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      IMAGE_TAG: release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build AWS image
        run: python3 scripts/build_container.py --target aws --tag "deep-agentic-core-mcp:$IMAGE_TAG"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish immutable image
        id: image
        shell: bash
        run: |
          repository_uri=$(aws cloudformation describe-stacks --stack-name deep-agentic-core-mcp-assets --query 'Stacks[0].Outputs[?OutputKey==`RepositoryUri`].OutputValue | [0]' --output text)
          registry="${repository_uri%%/*}"
          repository="${repository_uri#*/}"
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout "$registry" >/dev/null 2>&1; rm -rf "$DOCKER_CONFIG"' EXIT
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag "deep-agentic-core-mcp:$IMAGE_TAG" "$repository_uri:$IMAGE_TAG"
          docker push "$repository_uri:$IMAGE_TAG"
          digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "uri=$repository_uri@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy image through CloudFormation
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: python3 scripts/aws_ci_deploy.py --image "$IMAGE_URI" --change-set "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Verify hosted MCP
        env:
          MCP_API_KEY: ${{ secrets.MCP_SMOKE_KEY }}
          MCP_ORIGIN: https://mcp.deepagentlabs.io
        run: python3 scripts/ci_smoke.py

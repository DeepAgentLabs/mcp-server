name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: mcp-server

      - name: Check out agenticlens
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Check out agentic-chaos
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agentic-chaos
          path: agentic-chaos

      - name: Check out ai-operations-spec
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/ai-operations-spec
          path: ai-operations-spec

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: mcp-server
        run: |
          uv sync --frozen --extra dev --extra http --python ${{ matrix.python-version }}
          uv pip install -e ../agenticlens -e ../agentic-chaos

      - name: Lint (ruff check)
        working-directory: mcp-server
        run: uv run --no-sync ruff check .

      - name: Format check (ruff format)
        working-directory: mcp-server
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        working-directory: mcp-server
        run: uv run --no-sync mypy

      - name: Test (pytest)
        working-directory: mcp-server
        run: uv run --no-sync pytest

  test-chaos-v05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: mcp-server
      - name: Check out the advertised Chaos minimum
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agentic-chaos
          ref: v0.5.0
          path: agentic-chaos
      - uses: astral-sh/setup-uv@v7
      - name: Install MCP and Chaos v0.5.0
        working-directory: mcp-server
        run: |
          uv sync --frozen --extra dev --extra http --python 3.12
          uv pip install -e ../agentic-chaos
      - name: Verify minimum-version catalog and experiment compatibility
        working-directory: mcp-server
        run: |
          uv run --no-sync python -c "import agentic_chaos; assert agentic_chaos.__version__ == '0.5.0'"
          uv run --no-sync pytest tests/test_chaos_v05.py

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: mcp-server
      - name: Check out agenticlens
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens
      - uses: astral-sh/setup-uv@v7
      - name: Install MCP with the hosted extras
        working-directory: mcp-server
        run: |
          uv sync --frozen --extra dev --extra http --python 3.12
          uv pip install -e ../agenticlens
      - name: Keys, access policies, sessions and signup limits against PostgreSQL
        working-directory: mcp-server
        env:
          DEEP_AGENTIC_CORE_MCP_TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
        run: uv run --no-sync pytest tests/test_postgres_store.py

  package:
    runs-on: ubuntu-latest
    needs: [test, test-chaos-v05, test-postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          path: mcp-server

      - name: Check out agenticlens
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Check out agentic-chaos
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agentic-chaos
          path: agentic-chaos

      - name: Check out ai-operations-spec
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/ai-operations-spec
          path: ai-operations-spec

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: mcp-server
        run: |
          uv sync --frozen --extra dev --extra http --python 3.12
          uv pip install -e ../agenticlens -e ../agentic-chaos

      - name: Build distributions
        working-directory: mcp-server
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python -m twine check dist/*

      - name: Verify standalone installed-wheel schema resources
        working-directory: mcp-server
        run: |
          for wheel in dist/*.whl; do
            uv run --isolated --no-project --with "$wheel" python -I scripts/smoke_evals_contract.py
          done

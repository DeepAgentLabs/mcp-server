name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: mcp-server

      - name: Check out agenticlens
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Check out agentic-chaos
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agentic-chaos
          path: agentic-chaos

      - name: Check out ai-operations-spec
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/ai-operations-spec
          path: ai-operations-spec

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: mcp-server
        run: |
          uv sync --frozen --extra dev --extra http --python ${{ matrix.python-version }}
          uv pip install -e ../agenticlens -e ../agentic-chaos

      - name: Lint (ruff check)
        working-directory: mcp-server
        run: uv run --no-sync ruff check .

      - name: Format check (ruff format)
        working-directory: mcp-server
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        working-directory: mcp-server
        run: uv run --no-sync mypy

      - name: Test (pytest)
        working-directory: mcp-server
        run: uv run --no-sync pytest

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          path: mcp-server

      - name: Check out agenticlens
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Check out agentic-chaos
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agentic-chaos
          path: agentic-chaos

      - name: Check out ai-operations-spec
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/ai-operations-spec
          path: ai-operations-spec

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: mcp-server
        run: |
          uv sync --frozen --extra dev --extra http --python 3.12
          uv pip install -e ../agenticlens -e ../agentic-chaos

      - name: Build distributions
        working-directory: mcp-server
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python -m twine check dist/*

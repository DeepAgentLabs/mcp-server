site_name: DeepAgentLabs MCP Server
site_description: Unified MCP server for agentic workflow analysis, resilience testing, and supervision readiness.
site_url: https://deepagentlabs.io/deep-agentic-core-mcp/

theme:
  name: material

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide: user-guide.md
  - Remote Hosting: remote-hosting.md
  - Hosted Access Control: access-control.md
  - Architecture: architecture.md
  - Features: features.md
  - Configuration: configuration.md
  - Integrations: integrations.md
  - Unified Workflows: unified-workflows.md
  - Chaos 0.7 Compatibility: chaos-0.7.md
  - Chaos 0.8 Compatibility: chaos-0.8.md
  - Chaos 0.9 Compatibility: chaos-0.9.md
  - AIOS 0.6.1 Compatibility: aios-0.6.1.md
  - Evals CLI Compatibility: evals-0.8-cli.md
  - Evals Report Contract: evals-report-contract.md
  - Evals 0.9 Judge Reliability: evals-0.9-judge-reliability.md
  - Sidecar 0.8 Compatibility: sidecar-v0.8.md
  - Control Tower: tower-0.7-fleet-operations.md
  - Control Tower 0.8 Live Operations: tower-0.8-live-operations.md
  - Examples: examples.md
  - Use Cases:
      - Overview: usecases/index.md
      - AI Travel Planner: usecases/use-case-1.md
      - Workflow Fault Testing: usecases/use-case-2.md
      - Evaluation and Release Gate: usecases/use-case-3.md
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Roadmap: roadmap.md

docs_dir: docs

exclude_docs: tools.md

strict: true

extra:
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
